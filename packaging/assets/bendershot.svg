<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3584e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c71d8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (GNOME Adwaita style) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#grad1)" filter="url(#shadow)" />

  <!-- Camera Aperture / Viewfinder outline -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9" />

  <!-- Crop reticle / corners -->
  <path d="M 40 50 L 40 40 L 50 40" fill="none" stroke="#f66151" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 88 50 L 88 40 L 78 40" fill="none" stroke="#f66151" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 78 L 40 88 L 50 88" fill="none" stroke="#f66151" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 88 78 L 88 88 L 78 88" fill="none" stroke="#f66151" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Centered shutter target circle -->
  <circle cx="64" cy="64" r="14" fill="#ffffff" />
  <circle cx="64" cy="64" r="8" fill="#e01b24" />
</svg>
