name: CI & Packaging

on:
  push:
    branches: [ "master", "port/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Run Tests
        run: cargo test --verbose

  package-windows:
    name: Package Windows (Inno Setup)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release Binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\bendershot.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenderShot-Windows-Installer
          path: packaging/dist/BenderShot-Setup-x64.exe

  package-linux:
    name: Package Linux (deb, rpm, AppImage, tar.gz)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgl1-mesa-dev rpm

      - name: Build Packages
        run: |
          chmod +x packaging/package.sh
          ./packaging/package.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BenderShot-Linux-Packages
          path: packaging/dist/*
